name: Test, build and deploy

# main: test, build amd64 as `edge` and deploy to the owner's server.
# v* tags (releases, DP-1): test, build amd64 + arm64 as `X.Y.Z`, `X.Y` and `latest`, and attach
# the release compose files (DP-2). Releases are never deployed by this workflow.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sandermvanvliet/tellybox

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng

      - name: Install
        run: pip install ".[dev]"

      - name: Lint install script
        run: shellcheck deploy/install.sh

      - name: Test
        run: pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
          # arm64 builds under emulation and takes several minutes; only for releases and manual runs.
          if [ "${{ github.ref_type }}" = tag ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ steps.version.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the GitHub release with the install files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets can't start with a dot, so .env.example goes up as env.example.
          mkdir -p _assets
          [ -f deploy/docker-compose.yml ] && cp deploy/docker-compose.yml _assets/
          [ -f deploy/.env.example ] && cp deploy/.env.example _assets/env.example
          [ -f deploy/install.sh ] && cp deploy/install.sh _assets/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          if [ -n "$(ls -A _assets)" ]; then
            gh release upload "$GITHUB_REF_NAME" _assets/* --clobber
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e  # a failed pull must fail the deploy, not leave the old version running unnoticed
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
