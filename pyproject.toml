[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tellybox"
version = "0.1.0"
description = "Parent-approved videos cast to the TV within a daily allowance"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sander van Vliet" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pychromecast>=14,<15",
    # Fallback copy only: the worker runs the updatable install in <data>/tools/yt-dlp (CI-5).
    "yt-dlp[default,deno]>=2026.8.19",
    "httpx>=0.27",  # web -> cast service API
    "jinja2>=3.1",  # admin pages
    "python-multipart>=0.0.9",  # admin form posts
    "argon2-cffi>=23.1",  # admin password hash (AD-1)
    "joserfc>=1.7.5",  # admin sign-in with OIDC: ID token signature and claims (AD-6)
    "babel>=2.14",  # interface languages: catalogs, extraction, dates (NF-13)
    # Smart splitting (v6): frame handling and title-card hashes; scene changes come from ffmpeg.
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "pillow>=10",  # resizing for our dHash (tellybox.detect.dhash)
    "pytesseract>=0.3.13",  # ES-9 OCR; needs the tesseract binary (in the image), skipped without it
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tellybox = "tellybox.cli:main"

[tool.setuptools.packages.find]
include = ["tellybox*"]

[tool.setuptools.package-data]
tellybox = ["migrations/*.sql", "locale/*/LC_MESSAGES/*.po", "web/static/**/*", "web/admin/templates/**/*", "web/admin/static/**/*"]  # frontends ship in the wheel

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = '-m "not slow"'
markers = ["slow: long-running benchmarks (NF-6); run with -m slow"]
