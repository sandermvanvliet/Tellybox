<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tellybox receiver spike (legacy SDK)</title>
<link rel="stylesheet" href="spike.css">
<script src="https://www.gstatic.com/cast/sdk/libs/receiver/2.0.0/cast_receiver.js"></script>
</head>
<body>
<video id="video"></video>
<div id="sky" hidden><div id="sun"></div></div>
<img id="img" alt="">
<pre id="log">loading…</pre>
<script src="spike-common.js"></script>
<script>
"use strict";
if (!window.cast || !cast.receiver) {
  log("legacy receiver SDK did NOT load", "error");
} else {
  try {
    const mgr = cast.receiver.CastReceiverManager.getInstance();
    const video = document.getElementById("video");
    new cast.receiver.MediaManager(video);
    watchVideo(video);
    const bus = mgr.getCastMessageBus(NS, cast.receiver.CastMessageBus.MessageType.JSON);
    transport = { send: (obj) => bus.broadcast(obj) };
    bus.onMessage = (e) => onMessage(e.data);
    mgr.onSenderConnected = (e) => { log(`sender connected ${e.senderId}`); hello(); };
    mgr.onSenderDisconnected = (e) => log(`sender disconnected ${e.reason}`);
    mgr.start();
    log(`legacy SDK started, version ${cast.receiver.VERSION || "?"}`);
  } catch (e) {
    log(`legacy SDK start FAILED ${e}`, "error");
  }
}
</script>
</body>
</html>
