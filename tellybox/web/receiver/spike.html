<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tellybox receiver spike (CAF)</title>
<link rel="stylesheet" href="spike.css">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<video id="video"></video>
<div id="sky" hidden><div id="sun"></div></div>
<img id="img" alt="">
<pre id="log">loading…</pre>
<script src="spike-common.js"></script>
<script>
"use strict";
if (!window.cast || !cast.framework) {
  log("CAF SDK did NOT load", "error");
} else {
  try {
    const ctx = cast.framework.CastReceiverContext.getInstance();
    const pm = ctx.getPlayerManager();
    const video = document.getElementById("video");
    try { pm.setMediaElement(video); log("setMediaElement ok"); }
    catch (e) { log(`setMediaElement FAILED ${e}`, "error"); }
    watchVideo(video);
    transport = { send: (obj) => ctx.sendCustomMessage(NS, undefined, obj) };
    ctx.addCustomMessageListener(NS, (e) => onMessage(e.data));
    ctx.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (e) => { log(`sender connected ${e.senderId}`); hello(); });
    ctx.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (e) => log(`sender disconnected ${e.reason}`));
    pm.addEventListener(cast.framework.events.EventType.ERROR, (e) => log(`player ERROR ${e.detailedErrorCode} ${e.reason || ""}`, "error"));
    pm.addEventListener(cast.framework.events.EventType.LOAD_START, () => log("player LOAD_START"));
    pm.addEventListener(cast.framework.events.EventType.PLAYING, () => log("player PLAYING"));
    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
    options.skipPlayersLoad = false;
    ctx.start(options);
    log(`CAF started, version ${cast.framework.VERSION || "?"}`);
  } catch (e) {
    log(`CAF start FAILED ${e}`, "error");
  }
}
</script>
</body>
</html>
